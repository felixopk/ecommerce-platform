name: Frontend Release (Tag → Build → Scan → Deploy)

on:
  push:
    tags:
      - "frontend-v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  build-scan-push-deploy:
    runs-on: self-hosted
    
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4
    
    - name: Extract version from tag
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/frontend-}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Release Version = $VERSION"
    
    - name: Build Docker image
      run: |
        docker build -t ghcr.io/felixopk/ecommerce-frontend:${{ steps.version.outputs.version }} frontend/ecommerce-frontend
    
    - name: Login to GHCR
      run: |
        echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
    
    - name: Push Image to GHCR
      run: |
        docker push ghcr.io/felixopk/ecommerce-frontend:${{ steps.version.outputs.version }}
    
    - name: Security Scan with Trivy
      run: |
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy image \
          --severity HIGH,CRITICAL \
          --format table \
          --exit-code 0 \
          ghcr.io/felixopk/ecommerce-frontend:${{ steps.version.outputs.version }}
    
    - name: Update and Apply Deployment
      run: |
        sed -i "s#ghcr.io/felixopk/ecommerce-frontend:.*#ghcr.io/felixopk/ecommerce-frontend:${{ steps.version.outputs.version }}#g" kubernetes/frontend-deployment.yaml
        kubectl apply -f kubernetes/frontend-deployment.yaml
        echo "✅ Deployed frontend:${{ steps.version.outputs.version }} to cluster"