name: Backend Release (Tag → Build → Scan → Deploy)

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  build-scan-push-deploy:
    runs-on: self-hosted
    
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4
      with:
        ref: main  # ← IMPORTANT: Checkout main branch, not the tag
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0  # Fetch all history so we can access tags
    
    - name: Extract version from tag
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Release Version = $VERSION"
    
    - name: Build Docker image
      run: |
        docker build -t ghcr.io/felixopk/ecommerce-backend:${{ steps.version.outputs.version }} backend
    
    - name: Login to GHCR
      run: |
        echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
    
    - name: Push Image to GHCR
      run: |
        docker push ghcr.io/felixopk/ecommerce-backend:${{ steps.version.outputs.version }}
    
    - name: Security Scan with Trivy
      run: |
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy image \
          --severity HIGH,CRITICAL \
          --format table \
          --exit-code 0 \
          ghcr.io/felixopk/ecommerce-backend:${{ steps.version.outputs.version }}
    
    - name: Update Kubernetes Manifest and Commit to Git (GitOps)
      run: |
        # Update the image tag in the manifest
        sed -i "s#ghcr.io/felixopk/ecommerce-backend:.*#ghcr.io/felixopk/ecommerce-backend:${{ steps.version.outputs.version }}#g" kubernetes/backend-deployment.yaml
        
        # Configure Git
        git config user.name "GitHub Actions Bot"
        git config user.email "actions@github.com"
        
        # Check if there are changes
        if git diff --quiet kubernetes/backend-deployment.yaml; then
          echo "No changes to manifest"
        else
          # Commit and push the change
          git add kubernetes/backend-deployment.yaml
          git commit -m "chore: update backend image to ${{ steps.version.outputs.version }}"
          git push origin main
          echo "✅ Updated manifest in Git - ArgoCD will deploy automatically"
        fi