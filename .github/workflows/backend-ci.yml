name: Backend Release (Tag → Build → Scan → Deploy)

on:
  push:
    tags:
      - "v*.*.*"     # triggers only when you push a version tag like v1.5.2

permissions:
  contents: write
  packages: write

jobs:
  build-scan-push-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Extract version from tag
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Release Version = $VERSION"

    - name: Build Docker image
      run: |
        docker build -t ghcr.io/felixopk/ecommerce-backend:${{ steps.version.outputs.version }} backend

    - name: Login to GHCR
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
    - name: Configure Kubeconfig
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBECONFIG_HOMELAB }}" | base64 -d > $HOME/.kube/config
        chmod 600 $HOME/.kube/config


    - name: Push Image to GHCR
      run: |
        docker push ghcr.io/felixopk/ecommerce-backend:${{ steps.version.outputs.version }}

    - name: Security Scan with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ghcr.io/felixopk/ecommerce-backend:${{ steps.version.outputs.version }}
        severity: HIGH,CRITICAL
        format: table
        scan-type: image
        exit-code: 1

    - name: Update Kubernetes Deployment Image Tag
      run: |
        sed -i "s#ghcr.io/felixopk/ecommerce-backend:.*#ghcr.io/felixopk/ecommerce-backend:${{ steps.version.outputs.version }}#g" kubernetes/backend-deployment.yaml

    - name: Apply Deployment to Cluster
      run: |
        kubectl apply -f kubernetes/backend-deployment.yaml
