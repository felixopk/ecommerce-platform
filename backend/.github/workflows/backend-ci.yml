name: Backend CI/CD

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"

jobs:
  build-test-secure:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install Node dependencies
      working-directory: backend
      run: npm install --force

    - name: Run Lint (Static Code Analysis)
      working-directory: backend
      run: npm run lint || echo "⚠️ Lint issues found, fix later"

    - name: Dependency Vulnerability Scan (npm audit)
      working-directory: backend
      run: npm audit --omit=dev || echo "⚠️ npm audit warnings"

    - name: Login to GHCR
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Docker image
      run: |
        docker build -t ghcr.io/${{ github.repository_owner }}/ecommerce-backend:latest ./backend

    - name: Trivy Image Scan (Fail on High/Critical vulns)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ghcr.io/${{ github.repository_owner }}/ecommerce-backend:latest
        format: 'table'
        exit-code: '1'
        severity: 'HIGH,CRITICAL'

    - name: Push image to GHCR (only if scan passed)
      if: success()
      run: |
        docker push ghcr.io/${{ github.repository_owner }}/ecommerce-backend:latest

    - name: Deploy to Homelab via SSH
      if: success()
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOMELAB_SERVER }}
        username: ${{ secrets.HOMELAB_USER }}
        password: ${{ secrets.HOMELAB_PASS }}
        script: |
          cd ~/ecommerce-platform/kubernetes
          kubectl set image deployment/ecommerce-backend ecommerce-backend=ghcr.io/${{ github.repository_owner }}/ecommerce-backend:latest -n ecommerce
          kubectl rollout status deployment/ecommerce-backend -n ecommerce --timeout=60s
